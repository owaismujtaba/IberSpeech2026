dataset:
  bids_root: "BIDS"
  task: "VCV"
  subjects: ["01", "02","03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"]
  datatype: "eeg"




preprocessing:
  l_freq: 0.1
  h_freq: 75.0
  resample_freq: 200
  tmin: -0.2
  tmax: 1.5
  baseline: [-0.2, 0.0]

decoding: 
    type: Words # Syllables/Words
    train: True


model:
  name: "EEGMamba" # Options: EEGConformer, EEGNetv4, ShallowFBCSPNet, Deep4Net
  
training:
  batch_size: 256
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  device: "cuda" # or "cpu"


workflow:
  create_syllable_epochs: false
  create_words_epochs: false
  
